spring:
  application:
    name: arete-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

server:
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

arete:
  jwt:
    secret: ${JWT_SECRET}
    issuer: arete-api
    access-expiration: 15m
    refresh-expiration: 30d
    cookie:
      secure: true
      access-same-site: LAX
      refresh-same-site: STRICT
      refresh-path: ${server.servlet.context-path}/auth
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    issuers:
      - accounts.google.com
      - https://accounts.google.com
  program:
    calendar-max-days: 62
    max-parts-per-day: 20
  program-template:
    blocked-terms: ${PROGRAM_TEMPLATE_BLOCKED_TERMS:}
    max-days: 366
    range-max-days: 92
    catalog:
      directory: ${PROGRAM_TEMPLATE_CATALOG_DIRECTORY:./catalog}
  import-job:
    polling-enabled: ${IMPORT_JOB_POLLING_ENABLED:true}
    poll-interval: ${IMPORT_JOB_POLL_INTERVAL:5s}
    batch-size: 5
    max-attempts: 5
    retry-backoff: 30s
    lease: 10m
